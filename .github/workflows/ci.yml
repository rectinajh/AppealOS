name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mockdrop:
    name: MockDrop integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run MockDrop tests
        run: npm test

  appealos-domain:
    name: AppealOS domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run appealos domain tests
        working-directory: apps/appealos
        run: python -m unittest -v
